# --- translucent blocks rendered by gbuffers_water ---
# Glass has no id here otherwise, so it falls into the Physics Mod water
# fallback (mc_Entity.x < 1.0) and gets shaded as water (waves, water colour,
# refraction) instead of glass. Give the glass family explicit ids so that
# fallback leaves it alone. 20 and 95 are the legacy glass ids.
block.20=glass glass_pane tinted_glass
block.95=white_stained_glass orange_stained_glass magenta_stained_glass light_blue_stained_glass yellow_stained_glass lime_stained_glass pink_stained_glass gray_stained_glass light_gray_stained_glass cyan_stained_glass purple_stained_glass blue_stained_glass brown_stained_glass green_stained_glass red_stained_glass black_stained_glass white_stained_glass_pane orange_stained_glass_pane magenta_stained_glass_pane light_blue_stained_glass_pane yellow_stained_glass_pane lime_stained_glass_pane pink_stained_glass_pane gray_stained_glass_pane light_gray_stained_glass_pane cyan_stained_glass_pane purple_stained_glass_pane blue_stained_glass_pane brown_stained_glass_pane green_stained_glass_pane red_stained_glass_pane black_stained_glass_pane
